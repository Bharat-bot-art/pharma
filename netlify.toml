[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200

[functions]
  included_files = ["node_modules/@libsql/**/*", "views/**", "data/**", "src/db/**"]
  node_bundler = "esbuild"
  external_node_modules = ["ejs", "libsql", "@libsql/linux-x64-gnu"]
